# Mosquitto del portal: recibe la telemetría de los ESP32.
#
# Nadie entra sin usuario y contraseña (allow_anonymous false), y cada cuenta
# solo puede lo suyo (acl): los sensores escriben telemetría y no leen nada;
# el receptor del portal lee y no escribe. Las contraseñas no están en este
# repositorio: `entrada.sh` arma el archivo al arrancar a partir del .env.

listener 1883
allow_anonymous false
password_file /mosquitto/run/passwd
acl_file /mosquitto/run/acl

# Los mensajes con QoS 1 de una sesión persistente (el receptor) se guardan
# aquí mientras el receptor está caído y se le entregan al volver.
persistence true
persistence_location /mosquitto/data/
autosave_interval 60

# Un mensaje de telemetría son ~100 bytes; el receptor descarta los de más de
# 2 KB. 4 KB de tope evita que alguien llene la memoria con mensajes gordos.
max_packet_size 4096
max_queued_messages 5000
max_inflight_messages 20
# Sin retener: un mensaje retenido le llegaría al receptor en cada reconexión
# como si fuera una lectura nueva.
retain_available false

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
