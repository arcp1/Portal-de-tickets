# Con certificado: todo por HTTPS y el puerto 80 solo redirige.
#
# Quien teclee la dirección sin https acaba igual en https, así que nadie tiene
# que acordarse de escribirlo.

server {
    listen 80;
    server_name _;

    # Se deja pasar el reto de Let's Encrypt por si algún día se usa un
    # certificado público en vez del interno.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/portal.crt;
    ssl_certificate_key /etc/nginx/certs/portal.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Un año. Solo se manda por HTTPS, así que no afecta a quien siga en HTTP.
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/comun/portal.conf;
}
