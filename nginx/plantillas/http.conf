# Sin certificado: el portal se sirve por HTTP.
#
# Es lo que corre en el equipo de desarrollo. **En la red de planta no es
# suficiente**: las contraseñas y los códigos de activación viajan en claro y
# cualquiera con acceso al switch los ve. Para eso está la variante HTTPS, que
# se activa sola en cuanto haya certificado en nginx/certs.

server {
    listen 80;
    server_name _;

    include /etc/nginx/comun/portal.conf;
}
