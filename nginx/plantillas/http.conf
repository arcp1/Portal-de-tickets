# Sin certificado propio: el portal se sirve por HTTP.
#
# Es lo que corre en el equipo de desarrollo y en el acceso directo por el
# tailnet. **En la red de planta no es suficiente por si solo**: las contrasenas
# y los codigos de activacion viajan en claro y cualquiera con acceso al switch
# los ve. Para eso esta la variante HTTPS, que se activa sola en cuanto haya
# certificado en nginx/certs, o Tailscale Funnel, que pone el TLS por su cuenta.

# --- Acceso directo (tailnet / red local) ---
#
# Aqui puede llegar cualquiera que alcance el puerto, asi que NO se incluye
# comun/confianza-proxy.conf: la IP del cliente es la de la conexion y ninguna
# cabecera la cambia.
# Traduce la cabecera `Upgrade` del cliente a la `Connection` que hay que
# mandarle al backend. Es la forma soportada de hacer de proxy para WebSocket:
#
#   el cliente manda `Upgrade: websocket`  ->  se manda `Connection: upgrade`
#   una peticion normal, sin `Upgrade`     ->  se manda `Connection: close`
#
# Poner `Connection: upgrade` fijo tambien "funciona" para el WebSocket, pero le
# manda esa cabecera a peticiones que no lo son, y eso rompe el reuso de
# conexiones contra el backend sin dar ningun sintoma claro.
#
# Va **aqui y no en comun/portal.conf** porque `map` solo vale en el contexto
# `http`, y portal.conf se incluye dentro de un `server`.
# Sin la versión de nginx en la cabecera `Server` ni en las páginas de error:
# es lo primero que mira quien busca qué vulnerabilidad le corresponde.
server_tokens off;

# Zonas de los límites del camino público (contexto `http`).
include /etc/nginx/comun/limites.conf;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Este camino es interno: se declara antes de incluir nada, porque
    # portal.conf ya usa la variable.
    set $portal_origen "interno";

    include /etc/nginx/comun/portal.conf;
    include /etc/nginx/comun/docs.conf;
}

# --- Entrada de Tailscale Funnel ---
#
# Publicado solo en 127.0.0.1:8080 del host, asi que lo unico que puede llegar
# es el tailscaled local. Por eso este `server` si se fia de la cabecera con la
# IP real, y por eso manda HSTS: Funnel termina el TLS con Let's Encrypt, la
# conexion del visitante siempre viaja cifrada.
server {
    listen 8081;
    server_name _;

    include /etc/nginx/comun/confianza-proxy.conf;
    include /etc/nginx/comun/tls.conf;
    include /etc/nginx/comun/portal.conf;
}
