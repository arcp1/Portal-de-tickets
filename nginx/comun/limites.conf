# Límites contra el abuso desde internet. Contexto `http`: lo incluyen las dos
# plantillas antes de sus `server`.
#
# **Solo cuentan en el camino público** (el `server` del 8081, detrás de
# Tailscale Funnel). La clave es la IP del visitante cuando `$portal_origen` es
# "publico" y vacía en cualquier otro caso, y nginx no cuenta las peticiones con
# clave vacía: la planta, por el acceso directo, no tiene más freno que el de la
# aplicación. Así un tope pensado para un bot no puede dejar sin servicio a una
# oficina entera.
#
# En el 8081 `$binary_remote_addr` es la IP real (confianza-proxy.conf la toma de
# la cabecera que pone Tailscale). Con IPv6 cada dirección cuenta aparte, y quien
# tiene un /64 tiene muchas: por eso los frenos de login de la aplicación agrupan
# por /64 (core/limitador.py). Esto es la primera línea, la barata.
#
# **Y solo para los equipos del tailnet** (desde el 2026-10-05, con la lista
# blanca de comun/lista-blanca.conf). Por el camino público ya solo entran el
# tailnet y las IP de la planta, y una IP de planta es la oficina entera detrás
# de una sola dirección: con frenos por IP, cien pestañas abiertas o el cambio
# de turno en el login la dejarían sin servicio. Las direcciones del tailnet son
# fijas (las reparte Tailscale), así que no hace falta repetir aquí la IP de la
# planta: lo que la lista blanca deja pasar y no es tailnet, es una oficina.
geo $es_tailnet {
    default              0;
    100.64.0.0/10        1;
    fd7a:115c:a1e0::/48  1;
}

map "$portal_origen:$es_tailnet" $clave_publica {
    "publico:1"  $binary_remote_addr;
    default      "";
}

# La API en general: 30 peticiones por segundo sostenidas y ráfagas de 120 sin
# esperar (abrir el tablero son una docena a la vez). Un bot que pide miles por
# segundo recibe 429 sin llegar al backend.
limit_req_zone $clave_publica zone=api_publica:10m rate=30r/s;

# Inicio de sesión, activación y cambio de contraseña: cada intento cuesta un
# bcrypt (~170 ms de CPU). 20 por minuto y ráfaga de 10 por IP bastan para una
# oficina detrás de una sola IP en el cambio de turno, y dejan a cada atacante
# en una fracción de un núcleo. La aplicación además cuenta los fallos por
# cuenta y por red, y pone en fila los bcrypt (ver api/auth.py).
limit_req_zone $clave_publica zone=acceso_publico:10m rate=20r/m;

# Conexiones abiertas a la vez por IP. Cada pestaña del portal mantiene una
# (el canal de eventos), y un WebSocket sin identificar ocupa sitio hasta 10 s.
limit_conn_zone $clave_publica zone=conexiones_publicas:10m;

limit_req_status 429;
limit_conn_status 429;
limit_req_log_level warn;
limit_conn_log_level warn;
