# Rutas del portal, compartidas por la variante HTTP y la HTTPS.
# Se incluye desde dentro de un bloque `server`.

client_max_body_size 20M;

# Cabeceras de seguridad. Baratas y quitan clases enteras de problema.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# Politica de contenido completa, no solo el anti-framing que habia antes.
#
# La pieza que de verdad importa es `script-src 'self'`: aunque alguna vez se
# colara texto sin escapar en la interfaz, el navegador no ejecutaria un script
# inyectado ni traido de fuera. El token de sesion vive en localStorage, asi que
# un XSS es justo lo que lo dejaria salir.
#
# `style-src` admite 'unsafe-inline' a proposito: la interfaz usa estilos en
# linea por todas partes y un ataque via CSS es incomparablemente menos grave
# que uno via script. `img-src` acepta blob: y data: porque las fotos y los PDF
# se descargan autenticados y se muestran desde un blob.
# Ya no hay ningun `https://...` en la politica: con las tipografias
# autoalojadas, el portal no carga nada de fuera y la lista se cierra a 'self'.
# El navegador tiene prohibido pedirle cualquier cosa a cualquier otro dominio,
# asi que un script inyectado no tendria ni a donde mandar lo que robe.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Referrer-Policy "same-origin" always;
# HSTS **no** va aqui: este archivo lo comparten los `server` que sirven por
# HTTP en claro, y mandar HSTS desde uno de ellos le dice al navegador que
# fuerce HTTPS en ese host para siempre. En un host sin certificado eso deja a
# la gente sin poder entrar, y no hay forma de deshacerlo desde el servidor.
# Se manda solo donde de verdad hay TLS: ver comun/tls.conf.

# El grafo en vivo: lo unico del portal que habla por WebSocket.
#
# **Va antes que `/api/` y por eso funciona.** nginx elige la ruta por prefijo
# mas largo, no por orden, asi que esta gana sobre el `location /api/` de abajo
# — que es justo lo que hace falta, porque ese bloque no pasa las cabeceras de
# `Upgrade` y sin ellas el apreton de manos del WebSocket no llega nunca al
# backend: el navegador recibe un 200 normal y la conexion muere ahi.
#
# Los tres ajustes de abajo son los tres motivos por los que un WebSocket
# detras de un proxy falla, y cada uno falla distinto:
#
#   proxy_http_version 1.1  — el 1.0 no tiene `Upgrade`. Sin esto no hay
#                             WebSocket en absoluto.
#   Upgrade / Connection    — las cabeceras del apreton de manos. `$http_upgrade`
#                             viene del cliente; `$connection_upgrade` sale del
#                             `map` que esta al principio de la plantilla.
#   proxy_read_timeout      — el mas traicionero. Por defecto son 60 s **sin
#                             recibir nada**, y una conexion inactiva se corta
#                             sola. El backend manda un latido cada 20 s
#                             (TRAZA_LATIDO_SEGUNDOS), asi que con holgura de
#                             una hora nunca se llega; el limite sigue puesto
#                             para que una conexion de verdad muerta se suelte.
location /api/conciencia/flujo {
    proxy_pass http://backend:8000/api/conciencia/flujo;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header Host $host;
    proxy_set_header X-Portal-Origen $portal_origen;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    # Un flujo que se almacena antes de reenviarlo no es un flujo. Igual que la
    # cabecera X-Accel-Buffering del canal de eventos, pero aqui se apaga desde
    # nginx porque un WebSocket no lleva cabeceras de respuesta donde pedirlo.
    proxy_buffering off;
}

# API
location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_set_header Host $host;
    # Procedencia real, la que fijo el `server`, no la que diga el cliente: al
    # asignarla aqui, cualquier X-Portal-Origen que venga de fuera se pisa. Es
    # lo que impide hacerse pasar por interno para activar una cuenta con datos
    # personales desde internet.
    proxy_set_header X-Portal-Origen $portal_origen;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Aplicación
location / {
    proxy_pass http://frontend:80/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
