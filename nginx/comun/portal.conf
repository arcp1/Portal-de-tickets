# Rutas del portal, compartidas por la variante HTTP y la HTTPS.
# Se incluye desde dentro de un bloque `server`.

# **Cuerpo de 1 MB por omisión.** Era 20 MB para todo el portal: cualquier
# ruta, también las que no esperan nada, aceptaba 20 MB que nginx guardaba
# antes de pasárselos al backend. Los JSON legítimos no llegan a 1 MB (el
# backend corta ahí, CUERPO_JSON_MAX_KB). Solo las rutas de subida, más
# abajo, admiten archivos, y cada una con su propio tope.
client_max_body_size 1m;

# Tiempos de espera cortos, contra quien abre conexiones y manda las cabeceras
# o el cuerpo gota a gota para tenerlas ocupadas (slowloris). Cuentan entre
# dos lecturas, no en total: una subida lenta pero que avanza no se corta.
client_header_timeout 10s;
client_body_timeout 20s;
send_timeout 30s;
keepalive_timeout 30s;
reset_timedout_connection on;

# Conexiones a la vez por IP, solo en el camino público (comun/limites.conf).
limit_conn conexiones_publicas 100;

# Cabeceras de seguridad. Baratas y quitan clases enteras de problema.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# Politica de contenido completa, no solo el anti-framing que habia antes.
#
# La pieza que de verdad importa es `script-src 'self'`: aunque alguna vez se
# colara texto sin escapar en la interfaz, el navegador no ejecutaria un script
# inyectado ni traido de fuera. El token de sesion vive en localStorage, asi que
# un XSS es justo lo que lo dejaria salir.
#
# `style-src` admite 'unsafe-inline' a proposito: la interfaz usa estilos en
# linea por todas partes y un ataque via CSS es incomparablemente menos grave
# que uno via script. `img-src` acepta blob: y data: porque las fotos y los PDF
# se descargan autenticados y se muestran desde un blob.
# Ya no hay ningun `https://...` en la politica: con las tipografias
# autoalojadas, el portal no carga nada de fuera y la lista se cierra a 'self'.
# El navegador tiene prohibido pedirle cualquier cosa a cualquier otro dominio,
# asi que un script inyectado no tendria ni a donde mandar lo que robe.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Referrer-Policy "same-origin" always;
# Lo que una página del portal no puede pedirle al navegador. No usa ninguna
# de estas (las fotos entran por <input type=file>, que no depende de esto):
# cerrarlas quita a un script inyectado la cámara, el micrófono y la ubicación.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Aislamiento entre orígenes, ahora que el portal se publica en internet:
#   COOP — una página de otro sitio que abra el portal en una ventana no puede
#          tocarla ni leer nada de ella (window.opener queda vacío).
#   CORP — ningún otro sitio puede incrustar nuestras respuestas (una imagen,
#          un JSON) en su página. El portal solo se pide recursos a sí mismo.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# HSTS **no** va aqui: este archivo lo comparten los `server` que sirven por
# HTTP en claro, y mandar HSTS desde uno de ellos le dice al navegador que
# fuerce HTTPS en ese host para siempre. En un host sin certificado eso deja a
# la gente sin poder entrar, y no hay forma de deshacerlo desde el servidor.
# Se manda solo donde de verdad hay TLS: ver comun/tls.conf.

# El grafo en vivo: lo unico del portal que habla por WebSocket.
#
# **Va antes que `/api/` y por eso funciona.** nginx elige la ruta por prefijo
# mas largo, no por orden, asi que esta gana sobre el `location /api/` de abajo
# — que es justo lo que hace falta, porque ese bloque no pasa las cabeceras de
# `Upgrade` y sin ellas el apreton de manos del WebSocket no llega nunca al
# backend: el navegador recibe un 200 normal y la conexion muere ahi.
#
# Los tres ajustes de abajo son los tres motivos por los que un WebSocket
# detras de un proxy falla, y cada uno falla distinto:
#
#   proxy_http_version 1.1  — el 1.0 no tiene `Upgrade`. Sin esto no hay
#                             WebSocket en absoluto.
#   Upgrade / Connection    — las cabeceras del apreton de manos. `$http_upgrade`
#                             viene del cliente; `$connection_upgrade` sale del
#                             `map` que esta al principio de la plantilla.
#   proxy_read_timeout      — el mas traicionero. Por defecto son 60 s **sin
#                             recibir nada**, y una conexion inactiva se corta
#                             sola. El backend manda un latido cada 20 s
#                             (TRAZA_LATIDO_SEGUNDOS), asi que con holgura de
#                             una hora nunca se llega; el limite sigue puesto
#                             para que una conexion de verdad muerta se suelte.
location /api/conciencia/flujo {
    proxy_pass http://backend:8000/api/conciencia/flujo;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    include /etc/nginx/comun/proxy-api.conf;

    limit_req zone=api_publica burst=120 nodelay;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    # Un flujo que se almacena antes de reenviarlo no es un flujo. Igual que la
    # cabecera X-Accel-Buffering del canal de eventos, pero aqui se apaga desde
    # nginx porque un WebSocket no lleva cabeceras de respuesta donde pedirlo.
    proxy_buffering off;
}

# Las subidas de archivos: las únicas rutas con cuerpo grande.
#
# Una expresión regular gana a un prefijo simple como `/api/`, así que estas se
# eligen antes aunque estén escritas en cualquier orden. `proxy_pass` va sin
# ruta: se reenvía la URI tal cual llegó. Cada tope es el del backend más 1 MB
# de holgura para la envoltura multipart (ver *_MAX_MB en core/config.py).
#
# Documentos del expediente: 20 MB (DOCUMENTOS_MAX_MB). Con el tope anterior de
# 20 MB para todo, un documento de justo 20 MB no cabía por la envoltura.
location ~ ^/api/documentos$ {
    client_max_body_size 21m;
    limit_req zone=api_publica burst=120 nodelay;
    proxy_pass http://backend:8000;
    include /etc/nginx/comun/proxy-api.conf;
}

# Comprobantes de gastos de TI y el XML del CFDI para llenar el formulario:
# 20 MB (GASTOS_MAX_MB), como el expediente.
location ~ ^/api/gastos/([0-9]+/comprobantes|cfdi/analizar)$ {
    client_max_body_size 21m;
    limit_req zone=api_publica burst=120 nodelay;
    proxy_pass http://backend:8000;
    include /etc/nginx/comun/proxy-api.conf;
}

# Directorio de documentos: 50 MB por subida, sumando todos los archivos
# (DIRECTORIO_MAX_MB). Es el mismo número en los dos lados: el backend vuelve
# a contar por si nginx no estuviera delante. Solo las dos rutas que reciben
# archivos —subir a una carpeta y una versión nueva—; el resto del directorio
# es JSON y se queda en el 1 MB de siempre.
location ~ ^/api/directorio/(carpetas/[0-9]+/archivos|archivos/[0-9]+/contenido)$ {
    client_max_body_size 50m;
    limit_req zone=api_publica burst=120 nodelay;
    proxy_pass http://backend:8000;
    include /etc/nginx/comun/proxy-api.conf;
}

# Adjuntos de ticket, imágenes del conocimiento, fotos del catálogo visual (10
# MB cada una) y el padrón para importar (5 MB).
location ~ ^/api/(tickets/[0-9]+/adjuntos|imagenes/(paso|kb|ticket|solucion)/[0-9]+|admin/visual/[0-9]+/imagenes|admin/importacion/(analizar|importar))$ {
    client_max_body_size 11m;
    limit_req zone=api_publica burst=120 nodelay;
    proxy_pass http://backend:8000;
    include /etc/nginx/comun/proxy-api.conf;
}

# Lo que cuesta un bcrypt por intento: entrar, activar y cambiar la contraseña.
# Con su propio cupo, más corto (comun/limites.conf): desde internet son lo que
# un atacante repite, y cada intento son ~170 ms de CPU.
# El inicio de sesión con Microsoft va en el mismo cupo: cada vuelta del
# callback cuesta dos llamadas a Microsoft (ver api/sso_microsoft.py).
location ~ ^/api/auth/(login|login/form|activar|cambiar-password|microsoft/(login|callback|canje))$ {
    limit_req zone=acceso_publico burst=10 nodelay;
    proxy_pass http://backend:8000;
    include /etc/nginx/comun/proxy-api.conf;
}

# API
location /api/ {
    proxy_pass http://backend:8000/api/;
    include /etc/nginx/comun/proxy-api.conf;
    limit_req zone=api_publica burst=120 nodelay;
}

# Aplicación
location / {
    proxy_pass http://frontend:80/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
