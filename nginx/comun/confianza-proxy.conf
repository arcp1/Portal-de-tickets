# Confianza en la cabecera que trae la IP real del visitante.
#
# **Este archivo solo se incluye en el `server` del puerto 8081**, publicado
# unicamente en 127.0.0.1 y reservado a Tailscale Funnel. Ahi la unica forma de
# llegar es a traves del tailscaled del host, asi que su X-Forwarded-For es de
# fiar. Docker presenta esa conexion como venida de la puerta de enlace de su
# red, por eso es esa la que aparece como de confianza.
#
# En el puerto 80 —acceso directo desde el tailnet— esto NO se incluye a
# proposito: cualquiera que llegue ahi puede inventarse la cabecera. Probado:
# con la confianza puesta en ese camino se podian falsificar las IPs a voluntad
# y saltarse los limitadores de intentos.
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
# `off` hace que se tome la **ultima** direccion de la lista, la que anadio el
# proxy mas cercano, en vez de recorrerla hasta la primera. Asi da igual que
# Tailscale reemplace la cabecera o que la anexe a lo que mando el cliente: en
# los dos casos la ultima entrada es la IP real. Con `on`, si anexara, el
# cliente podria colocar una entrada falsa delante y volver a elegir su IP.
real_ip_recursive off;

# Marca de procedencia: este camino es el publico.
#
# Se usa una **variable** y no `proxy_set_header` por una regla de nginx que se
# pasa por alto facil: los `proxy_set_header` de un `location` descartan todos
# los del `server`. Como portal.conf define los suyos dentro de `location
# /api/`, una cabecera puesta aqui arriba nunca habria llegado al backend, y la
# comprobacion habria quedado muerta sin que nadie lo notara.
set $portal_origen "publico";
