# Quién puede usar el portal por el camino público (Tailscale Funnel).
#
# Se incluye **solo** en el `server` del 8081, después de confianza-proxy.conf:
# para cuando nginx revisa esto, `$remote_addr` ya es la IP real del visitante
# (la que Tailscale pone en X-Forwarded-For). Comprobado el 2026-10-05:
# Tailscale **descarta** el X-Forwarded-For que mande el visitante y escribe el
# suyo, así que nadie en internet puede presentarse con la IP de la planta.
#
# El portal sale a internet para no tocar la red física de la empresa, no para
# que lo vea cualquiera: todo lo que no esté aquí recibe 403 sin llegar ni a la
# aplicación ni al backend. El acceso directo de la planta (puerto 80, solo en
# la IP del tailnet) no pasa por aquí.
#
# Para cambiar o añadir una IP: editar este archivo y `docker compose restart
# nginx`. Una IP nueva de oficina entra también exenta de los frenos por IP de
# nginx (ver comun/limites.conf), que es lo que hace falta para una red entera
# detrás de una sola dirección.

# La planta: IP pública del enlace empresarial (Uninet, estática).
allow 189.254.199.194;

# El tailnet: equipos de TI y quien tenga Tailscale. Las dos familias, porque
# un cliente de Tailscale puede llegar por su dirección IPv6 del tailnet.
allow 100.64.0.0/10;
allow fd7a:115c:a1e0::/48;

deny all;
