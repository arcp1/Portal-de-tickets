# Cabeceras que solo tienen sentido cuando la conexion viaja cifrada.
#
# Se incluye unicamente en los `server` que de verdad sirven por TLS: el 443 con
# certificado propio, y el 8081 detras de Tailscale Funnel, que termina el TLS
# por su cuenta con un certificado de Let's Encrypt.
#
# Mandar HSTS desde un `server` en claro seria un tiro en el pie: el navegador
# recordaria que ese host debe usarse solo por HTTPS, y en un host que no tiene
# certificado eso deja a la gente sin entrar, sin manera de deshacerlo desde el
# servidor. Por eso vive aparte y no en portal.conf.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
