# Documentacion interactiva de la API.
#
# **Solo se incluye en el acceso directo, nunca en el publico.** FastAPI la sirve
# sin autenticacion: publica el mapa completo de rutas, con los esquemas de cada
# cuerpo y cada respuesta. Puertas adentro es comodo para depurar; de cara a
# internet es entregarle a cualquiera el plano del sistema y de que datos guarda.
#
# Ademas el backend solo la sirve con ENVIRONMENT=development (o desarrollo,
# dev, local): en produccion estas dos rutas responden 404 aunque se llegue por
# aqui. Ver `documentacion_api_activa` en backend/app/core/config.py.
# Documentación de la API
location /docs {
    proxy_pass http://backend:8000/docs;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /openapi.json {
    proxy_pass http://backend:8000/openapi.json;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
