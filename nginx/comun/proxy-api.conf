# Las cabeceras que toda ruta de la API le pasa al backend. Se incluye dentro de
# cada `location` que hace de proxy a la API, porque los `proxy_set_header` de un
# `location` descartan todos los del `server` (ver confianza-proxy.conf).
#
# X-Portal-Origen: la procedencia real, la que fijó el `server`, no la que diga
# el cliente. Al asignarla aquí se pisa cualquier X-Portal-Origen que venga de
# fuera: es lo que impide hacerse pasar por interno para activar una cuenta con
# datos personales desde internet.
proxy_set_header Host $host;
proxy_set_header X-Portal-Origen $portal_origen;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
