[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# `path_separator` sustituye a `version_path_separator`, que Alembic ya avisa de
# que retira. Sin el nuevo, cae al reparto antiguo —separar por espacios— y una
# ruta con un espacio dentro se partiria en dos.
path_separator = os

# Vacia a proposito: la contrasena no vive en un archivo versionado. La pone
# app/main.py desde DATABASE_URL al aplicar las migraciones, y alembic/env.py
# hace lo mismo cuando se invoca a mano.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
