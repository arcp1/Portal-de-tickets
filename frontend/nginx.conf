server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresion.
    #
    # Faltaba, y no era gratis: el trozo de `three` viajaba en 494 KB cuando
    # comprimido son 128. En la red de planta eso son varios segundos de
    # diferencia en la primera carga del login, que es la pantalla que abre
    # todo el mundo.
    #
    # Solo texto: JavaScript, CSS, JSON y SVG comprimen entre un 70 y un 80 %.
    # Las imagenes y los WebP del fondo ya vienen comprimidos y volver a
    # pasarlos por gzip solo gasta CPU sin ahorrar bytes; por eso no estan en
    # la lista.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # Archivos ocultos y mapas de fuente: 404, no la aplicación.
    #
    # Sin esto, `/.env` o `/.git/config` respondían 200 con el index.html del
    # fallback de abajo. No filtraba nada, pero un escáner de internet lo
    # anota como hallazgo y se queda insistiendo. Los `.map` no existen
    # (vite.config.js los apaga); esto asegura que tampoco se sirvan si
    # alguien los vuelve a generar.
    location ~ (^|/)\. {
        return 404;
    }
    location ~ \.map$ {
        return 404;
    }

    # React Router maneja las rutas en el cliente. Sin este fallback, recargar
    # en /tickets/5 o entrar por un enlace directo devuelve 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets llevan hash en el nombre, así que se pueden cachear fuerte.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El Service Worker se revisa en cada visita: si se cacheara, una versión
    # vieja seguiría mandando sobre la caché hasta que caducara.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    # El manifiesto de la PWA, con su tipo: algunos navegadores no lo aceptan
    # como text/plain.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # index.html nunca se cachea: es quien apunta a los assets nuevos tras un
    # despliegue.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
